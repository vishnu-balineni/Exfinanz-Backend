# Server Config
server.port=8080

# PostgreSQL Connection (Cloud Configured with Local Failover)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ezfinanz_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Vishnu123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA Settings
# 'update' preserves data and safely migrates new table schemas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CORS config will be handled in a config class, but we can setup basic stuff
